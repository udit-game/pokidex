spring.application.name=pokidex
spring.mvc.servlet.path=/api/v1/pokemon
server.port=8080
server.compression.enabled=true

spring.threads.virtual.enabled=true
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,metrics,info

pokedex.cors.allowed-origins=http://localhost:5173,http://localhost:3000

pokedex.upstream.base-url=https://pokeapi.co/api/v2
pokedex.upstream.connect-timeout=2s
pokedex.upstream.read-timeout=5s
pokedex.upstream.max-total-connections=50
pokedex.upstream.max-per-route=50
pokedex.upstream.max-retries=1

pokedex.cache.pokemon.max-entries=2000
pokedex.cache.pokemon.ttl=6h

pokedex.cache.species.max-entries=2000
pokedex.cache.species.ttl=6h

pokedex.cache.names.max-entries=1
pokedex.cache.names.ttl=24h

pokedex.cache.not-found.max-entries=1000
pokedex.cache.not-found.ttl=60s

pokedex.search.default-limit=10
pokedex.search.max-limit=50

management.endpoints.web.exposure.include=health